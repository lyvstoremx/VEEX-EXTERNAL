name: ios27-inspect
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -y install llvm unzip >/dev/null
      - name: Desplegar
        run: |
          set -e
          W="$GITHUB_WORKSPACE/work"
          mkdir -p "$W" && cd "$W"
          unzip -o "$GITHUB_WORKSPACE/3105ios27.ipa" >/dev/null
          APP=$(find "$W/Payload" -maxdepth 1 -name '*.app' | head -1)
          BIN="$APP/$(python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleExecutable'])" "$APP/Info.plist")"
          echo "BIN=$BIN" >> $GITHUB_ENV
      - name: Servicios y pairing
        run: |
          grep -aoE '[A-Za-z0-9_.:/ -]{4,60}' "$BIN" | grep -iE 'house_arrest|vendcontainer|com\.apple\.afc|mobilehousearrest|pairing|mobiledevicepairing|usbmux|62078|Containers/' | sort -u | head -80
      - name: Cadenas de import
        run: |
          grep -aoE '[A-Za-z0-9_ .:/%()-]{5,70}' "$BIN" | grep -iE 'import|patch|afc|exploit|digest|fingerprint|package' | sort -u | head -200
