name: ios27-inspect
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -y install llvm unzip >/dev/null
      - name: Desplegar
        run: |
          set -e
          W="$GITHUB_WORKSPACE/work"
          mkdir -p "$W" && cd "$W"
          unzip -o "$GITHUB_WORKSPACE/3105ios27.ipa" >/dev/null
          APP=$(find "$W/Payload" -maxdepth 1 -name '*.app' | head -1)
          BIN="$APP/$(python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleExecutable'])" "$APP/Info.plist")"
          echo "BIN=$BIN" >> $GITHUB_ENV
      - name: API C exportada
        run: |
          llvm-nm --defined-only "$BIN" 2>/dev/null | grep -E ' _(afc|installation_proxy|patch|import|payload|pkg|exploit|device|lockdown|tunnel|rsd|tcp|idevice)' | head -200
      - name: Clases ObjC
        run: |
          grep -aoE '_OBJC_CLASS_\$_[A-Za-z0-9_]+' "$BIN" | sort -u | head -300
      - name: Tipos Swift del app
        run: |
          grep -aoE '_\$s[0-9]{1,3}[A-Za-z0-9_]{4,}' "$BIN" | grep -viE 'Foundation|SwiftUI|UIKit|PhotosUI|Combine|CoreGraphics|Darwin|Dispatch|Observation|DeveloperTools' | sort -u | head -120
      - name: Cadenas de UI
        run: |
          grep -aoE '[A-Za-z0-9_ .:-]{5,60}' "$BIN" | grep -iE 'import|patch|exploit|afc|error|password|fingerprint|invalid|version' | sort -u | head -200
