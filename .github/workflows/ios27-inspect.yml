name: ios27-inspect
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -y install unzip >/dev/null
      - name: Desplegar
        run: |
          set -e
          W="$GITHUB_WORKSPACE/work"
          mkdir -p "$W" && cd "$W"
          unzip -o "$GITHUB_WORKSPACE/3105ios27.ipa" >/dev/null
          APP=$(find "$W/Payload" -maxdepth 1 -name '*.app' | head -1)
          BIN="$APP/$(python3 -c "import plistlib,sys;print(plistlib.load(open(sys.argv[1],'rb'))['CFBundleExecutable'])" "$APP/Info.plist")"
          echo "BIN=$BIN" >> $GITHUB_ENV
      - name: Servicios
        run: |
          grep -aoE 'com\.apple\.[A-Za-z0-9._-]{3,50}' "$BIN" | sort -u | head -60
          echo "---"
          grep -aoE '[A-Za-z0-9_.-]*(rsd|service|kexploit|airlift)[A-Za-z0-9_.-]*' "$BIN" | sort -u | head -60
