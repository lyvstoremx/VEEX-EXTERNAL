name: build
on: workflow_dispatch
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -quiet -project ThreeOneOSFive.xcodeproj -scheme 3105 \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -destination 'generic/platform=iOS' 2>&1 | tee build.log || true
          echo "----- ERRORES -----"
          grep -E "error:" build.log | head -20 || true
          echo "-------------------"
          if grep -q "error:" build.log; then exit 1; fi
      - name: Embed content
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app)
          if [ -d patches ]; then cp -R patches/*.3105 "$APP"/ ; fi
          if [ -d voices ]; then cp -R voices/*.m4a "$APP"/ ; fi
          ls "$APP"
      - name: Package
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/*.app out/Payload/
          cd out && zip -qry ../app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: app.ipa
