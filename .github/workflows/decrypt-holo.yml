name: decrypt-holo
on: workflow_dispatch

jobs:
  decrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Descifrar
        env:
          P3105: 'Levi-externas-veex-6393*#%'
        run: python tools/decrypt3105.py patches/holo_personaje.3105 out
      - uses: actions/upload-artifact@v4
        with:
          name: holo-descifrado
          path: out
