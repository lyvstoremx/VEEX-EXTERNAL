name: holo-textura
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/inject_holo.py"
      - ".github/workflows/inspect-holo.yml"

jobs:
  holo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet UnityPy pillow

      - name: Descifrar
        run: |
          mkdir -p work
          python tools/decrypt3105.py "patches/holo_personaje.3105" "Levi-externas-veex-6393*#%" work
          ls -l work

      - name: Recortar
        run: |
          python - <<'EOF'
          import glob, struct
          p = glob.glob("work/*.bundle")[0]
          b = bytearray(open(p, "rb").read())
          i = b.find(b"\x00")
          n = b.find(b"UnityFS")
          b = b[n:]
          pos = 0x30
          size = struct.unpack(">q", b[pos:pos+8])[0]
          end = 0x30 + 8 + 4 + 4 + size
          if len(b) > end:
              b = b[:end]
          open(p, "wb").write(bytes(b))
          print("recortado a", len(b))
          EOF

      - name: Inyectar
        run: python tools/inject_holo.py

      - name: Verificar
        run: |
          python - <<'EOF'
          import glob, UnityPy
          p = glob.glob("work/holo_new.bundle")[0]
          env = UnityPy.load(p)
          tex = [o for o in env.objects if o.type.name == "Texture2D"]
          print("Texture2D:", len(tex))
          for o in tex:
              t = o.read_typetree()
              print(" ", t["m_Name"], t["m_Width"], t["m_Height"], t["m_TextureFormat"], len(t["image data"]))
          for o in env.objects:
              if o.type.name == "Material":
                  for e in (o.read_typetree()["m_SavedProperties"]["m_TexEnvs"]):
                      print(" slot", e["first"], "->", e["second"]["m_Texture"]["m_PathID"])
          print("bytes", len(open(p, "rb").read()))
          EOF

      - name: Subir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holo-texturizado
          path: |
            work/holo_new.bundle
            report.txt
