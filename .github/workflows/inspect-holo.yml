name: inspect-holo
on: workflow_dispatch

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography UnityPy pillow lz4
      - name: Descifrar
        env:
          P3105: 'Levi-externas-veex-6393*#%'
        run: python tools/decrypt3105.py patches/holo_personaje.3105 out
      - name: Recortar e inspeccionar
        run: |
          python - <<'PY'
          import pathlib, json, lz4.block, UnityPy
          from UnityPy.enums.BundleFile import CompressionFlags
          from UnityPy.helpers import CompressionHelper

          def tolerante(data, size):
              for m in (1, 2, 4, 8, 16, 32, 64, 128):
                  try:
                      return lz4.block.decompress(data, uncompressed_size=max(size * m, 4096))
                  except Exception:
                      pass
              raise RuntimeError("lz4 imposible")

          for nombre in ("LZ4", "LZ4HC"):
              flag = getattr(CompressionFlags, nombre, None)
              if flag is not None:
                  CompressionHelper.DECOMPRESSION_MAP[flag] = tolerante
                  print("parcheado", nombre)

          out = pathlib.Path("out/tex"); out.mkdir(parents=True, exist_ok=True)
          rep = open("out/report.txt", "w")

          for f in sorted(pathlib.Path("out/blobs").glob("*.bin")):
              d = f.read_bytes()
              i = d.find(b"2018.4.12f1\x00")
              size = int.from_bytes(d[i + 12:i + 20], "big")
              print("declarado", size, "real", len(d), file=rep)
              fixed = out.parent / "blob_fixed.bin"
              fixed.write_bytes(d[:size] if 0 < size < len(d) else d)

              for etiqueta, ruta in (("recortado", fixed), ("original", f)):
                  try:
                      env = UnityPy.load(str(ruta))
                      objs = list(env.objects)
                      print(etiqueta, "OK objetos:", len(objs), file=rep)
                      for obj in objs:
                          row = {"t": obj.type.name}
                          try: row["name"] = obj.peek_name()
                          except Exception: pass
                          if obj.type.name in ("Texture2D", "Sprite"):
                              t = obj.parse_as_object()
                              row["w"], row["h"] = t.m_Width, t.m_Height
                              row["fmt"] = str(getattr(t, "m_TextureFormat", "?"))
                              t.image.save(out / f"{t.m_Name}.png")
                          print("OBJ", json.dumps(row, ensure_ascii=False), file=rep)
                      break
                  except Exception as e:
                      print(etiqueta, "FAIL", type(e).__name__, e, file=rep)
          rep.close()
          print(open("out/report.txt").read())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: holo-inspect
          path: out
