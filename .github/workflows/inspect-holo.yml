name: inspect-holo
on: workflow_dispatch

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography UnityPy pillow lz4
      - name: Descifrar
        env:
          P3105: 'Levi-externas-veex-6393*#%'
        run: python tools/decrypt3105.py patches/holo_personaje.3105 out
      - name: Volcar materiales
        run: |
          python - <<'PY'
          import pathlib, json, lz4.block, UnityPy
          from UnityPy.enums.BundleFile import CompressionFlags
          from UnityPy.helpers import CompressionHelper

          def tolerante(data, size):
              for m in (1, 2, 4, 8, 16, 32, 64, 128):
                  try:
                      return lz4.block.decompress(data, uncompressed_size=max(size * m, 4096))
                  except Exception:
                      pass
              raise RuntimeError("lz4 imposible")

          for nombre in ("LZ4", "LZ4HC"):
              flag = getattr(CompressionFlags, nombre, None)
              if flag is not None:
                  CompressionHelper.DECOMPRESSION_MAP[flag] = tolerante

          rep = open("out/materiales.txt", "w")
          for f in sorted(pathlib.Path("out/blobs").glob("*.bin")):
              d = f.read_bytes()
              i = d.find(b"2018.4.12f1\x00")
              size = int.from_bytes(d[i + 12:i + 20], "big")
              fijo = pathlib.Path("out/fijo.bin")
              fijo.write_bytes(d[:size] if 0 < size < len(d) else d)
              env = UnityPy.load(str(fijo))
              for obj in env.objects:
                  if obj.type.name == "Material":
                      dd = obj.parse_as_dict()
                      print("=== MATERIAL", dd.get("m_Name"), file=rep)
                      props = dd.get("m_SavedProperties", {})
                      print("  TEX:", json.dumps(props.get("m_TexEnvs"), default=str), file=rep)
                      print("  COL:", json.dumps(props.get("m_Colors"), default=str), file=rep)
                      print("  FLO:", json.dumps(props.get("m_Floats"), default=str), file=rep)
                  if obj.type.name == "Texture2D":
                      print("TEXTURA", obj.peek_name(), file=rep)
          rep.close()
          print(open("out/materiales.txt").read())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: holo-materiales
          path: out/materiales.txt
