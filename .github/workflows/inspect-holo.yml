name: holo-textura
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-holo.yml"

jobs:
  holo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet cryptography UnityPy pillow

      - name: Descifrar
        env:
          P3105: "Levi-externas-veex-6393*#%"
        run: |
          python tools/decrypt3105.py "patches/holo_personaje.3105" work
          ls -l work/blobs

      - name: Recortar
        run: |
          python - <<'EOF'
          import glob, os
          from io import BytesIO
          import UnityPy
          from UnityPy.streams import EndianBinaryReader

          src = max(glob.glob("work/blobs/*.bin"), key=os.path.getsize)
          b = bytearray(open(src, "rb").read())
          n = b.find(b"UnityFS")
          if n < 0:
              raise SystemExit("sin cabecera UnityFS")
          b = b[n:]

          r = EndianBinaryReader(BytesIO(bytes(b)), endian=">")
          r.read_string_to_null()
          r.read_u_int()
          r.read_string_to_null()
          r.read_string_to_null()
          size = r.read_long()
          cs = r.read_u_int()
          us = r.read_u_int()
          flags = r.read_u_int()
          pos = r.Position
          print("size", size, "pos", pos, "len", len(b), "flags", hex(flags))

          def ok(cut):
              if cut <= 0 or cut > len(b):
                  return None
              try:
                  env = UnityPy.load(bytes(b[:cut]))
                  objs = list(env.objects)
              except Exception:
                  return None
              if any(o.type.name == "Material" for o in objs):
                  return len(objs)
              return None

          cands = [size, pos + size, 32 + size, len(b)]
          cands += [len(b) - k for k in range(1, 9000)]

          for cut in cands:
              k = ok(cut)
              if k:
                  open("work/holo.bundle", "wb").write(bytes(b[:cut]))
                  print("VALIDO cut", cut, "objetos", k)
                  break
          else:
              raise SystemExit("ningun corte valido")
          EOF

      - name: Inyectar
        run: |
          python - <<'PY'
          import copy, glob, traceback
          import UnityPy
          from UnityPy.enums import ClassIDType
          from UnityPy.files import ObjectReader
          from UnityPy.helpers import TypeTreeHelper
          from UnityPy.helpers.Tpk import get_typetree_node
          from UnityPy.streams import EndianBinaryWriter
          from PIL import Image, ImageDraw, ImageFont

          REP = "report.txt"
          SRC = glob.glob("work/*.bundle")[0]
          OUT = "work/holo_new.bundle"

          def log(*a):
              s = " ".join(str(x) for x in a)
              print(s)
              with open(REP, "a", encoding="utf-8") as f:
                  f.write(s + "\n")

          def build_tex(size=512):
              img = Image.new("RGBA", (size, size), (0, 0, 0, 255))
              d = ImageDraw.Draw(img)
              font = ImageFont.truetype("DejaVuSans-Bold.ttf", 96)
              step, row, y = 175, 0, -14
              while y < size + step:
                  x = -50 + (0 if row % 2 == 0 else 88)
                  while x < size + step:
                      d.text((x, y), "LEVI", font=font, fill=(255, 0, 0, 255))
                      x += step
                  y += 120
                  row += 1
              d.rectangle([0, 0, size - 1, size - 1], outline=(255, 255, 255, 255), width=5)
              d.rectangle([5, 5, size - 6, size - 6], outline=(255, 255, 255, 255), width=2)
              return img.transpose(Image.FLIP_TOP_BOTTOM)

          ENTEROS = ("SInt8", "UInt8", "short", "SInt16", "unsigned short",
                     "UInt16", "int", "SInt32", "unsigned int", "UInt32",
                     "long long", "SInt64", "unsigned long long", "UInt64",
                     "FileSize", "Type*")

          VALUES = {
              "m_Name": "levi_holo",
              "m_ForcedFallbackFormat": 4,
              "m_DownscaleFallback": False,
              "m_IsAlphaChannelOptional": False,
              "m_Width": 512,
              "m_Height": 512,
              "m_TextureFormat": 4,
              "m_MipCount": 1,
              "m_IsReadable": True,
              "m_MipsStripped": 0,
              "m_StreamingMipmaps": False,
              "m_StreamingMipmapsPriority": 0,
              "m_ImageCount": 1,
              "m_TextureDimension": 2,
              "m_LightmapFormat": 0,
              "m_ColorSpace": 1,
              "m_FilterMode": 1,
              "m_Aniso": 1,
              "m_MipBias": 0.0,
              "m_WrapMode": 0,
              "m_WrapU": 0,
              "m_WrapV": 0,
              "m_WrapW": 0,
              "path": "",
              "offset": 0,
              "size": 0,
          }

          def fill(node, out, pixels):
              for ch in node.m_Children:
                  nm, ty = ch.m_Name, ch.m_Type
                  if ty == "TypelessData":
                      out[nm] = pixels
                  elif nm in VALUES:
                      out[nm] = VALUES[nm]
                  elif ty in ("string", "char"):
                      out[nm] = ""
                  elif ty == "bool":
                      out[nm] = False
                  elif ty in ("float", "double"):
                      out[nm] = 0.0
                  elif ty in ENTEROS:
                      out[nm] = 0
                  elif ch.m_Children:
                      out[nm] = {}
                      fill(ch, out[nm], pixels)
                  else:
                      out[nm] = 0

          def main():
              open(REP, "a", encoding="utf-8").close()
              raw = build_tex()
              pixels = raw.tobytes()
              log("textura", raw.size, "bytes", len(pixels))

              env = UnityPy.load(SRC)
              sf = None
              for o in env.objects:
                  if o.type.name == "Material":
                      sf = o.assets_file
                      break
              if sf is None:
                  log("sin SerializedFile con materiales")
                  return 1

              node = get_typetree_node(ClassIDType.Texture2D, sf.version)
              log("ESTRUCTURA:")
              log(node.dump_structure())

              d = {}
              fill(node, d, pixels)
              d["m_CompleteImageSize"] = len(pixels)
              d["image data"] = pixels

              st = copy.copy(sf.types[0])
              st.class_id = ClassIDType.Texture2D
              st.is_stripped_type = False
              st.script_type_index = -1
              st.script_id = None
              st.old_type_hash = b"\x00" * 16
              st.node = node
              st.type_dependencies = ()
              for extra, val in (("m_ClassName", None), ("m_NameSpace", None),
                                 ("m_AssemblyName", None), ("node_info_handler", None)):
                  try:
                      setattr(st, extra, val)
                  except Exception:
                      pass
              sf.types.append(st)
              type_id = len(sf.types) - 1

              w = EndianBinaryWriter(endian=sf.reader.endian)
              TypeTreeHelper.write_typetree(d, node, w, sf)
              blob = w.bytes
              log("blob texture", len(blob), "type_id", type_id)

              new_id = max(sf.objects.keys()) + 1
              obj = ObjectReader(sf, sf.reader, new_id, type_id, st,
                                 ClassIDType.Texture2D, ClassIDType.Texture2D,
                                 0, len(blob), None, None, blob)
              sf.objects[new_id] = obj
              log("path_id nuevo", new_id)

              hechos = 0
              for o in list(env.objects):
                  if o.type.name != "Material":
                      continue
                  t = o.read_typetree()
                  sp = t.get("m_SavedProperties") or {}
                  for e in sp.get("m_TexEnvs") or []:
                      if e.get("first") in ("_Tex", "_DisTex", "_Mask", "_EmissTex"):
                          e["second"]["m_Texture"]["m_PathID"] = new_id
                          e["second"]["m_Texture"]["m_FileID"] = 0
                          e["second"]["m_Scale"] = {"x": 1.0, "y": 1.0}
                          e["second"]["m_Offset"] = {"x": 0.0, "y": 0.0}
                  for e in sp.get("m_Colors") or []:
                      if e.get("first") in ("_Color", "_Color_Tex", "_EdgeColor"):
                          e["second"] = {"r": 1.0, "g": 1.0, "b": 1.0, "a": 1.0}
                  o.save_typetree(t)
                  hechos += 1
              log("materiales parcheados", hechos)

              f = list(env.files.values())[0]
              data = f.save(packer="original")
              open(OUT, "wb").write(data)
              log("bundle nuevo", len(data), "B")
              return 0

          try:
              raise SystemExit(main())
          except SystemExit:
              raise
          except Exception:
              log("FALLO")
              log(traceback.format_exc())
              raise SystemExit(1)
          PY

      - name: Verificar
        run: |
          python - <<'EOF'
          import UnityPy
          p = "work/holo_new.bundle"
          env = UnityPy.load(p)
          tex = [o for o in env.objects if o.type.name == "Texture2D"]
          print("Texture2D:", len(tex))
          for o in tex:
              t = o.read_typetree()
              print(" ", t["m_Name"], t["m_Width"], t["m_Height"], t["m_TextureFormat"], len(t["image data"]))
          for o in env.objects:
              if o.type.name == "Material":
                  for e in o.read_typetree()["m_SavedProperties"]["m_TexEnvs"]:
                      print(" slot", e["first"], "->", e["second"]["m_Texture"]["m_PathID"])
          print("bytes", len(open(p, "rb").read()))
          EOF

      - name: Subir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holo-texturizado
          path: |
            work/holo_new.bundle
            report.txt
