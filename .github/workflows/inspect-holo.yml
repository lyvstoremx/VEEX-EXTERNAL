name: inspect-holo
on: workflow_dispatch

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography UnityPy pillow lz4
      - run: sudo apt-get install -y fonts-dejavu-core
      - name: Descifrar
        env:
          P3105: 'Levi-externas-veex-6393*#%'
        run: python tools/decrypt3105.py patches/holo_personaje.3105 out
      - name: Inyectar textura
        run: |
          python - <<'PY'
          import pathlib, lz4.block, UnityPy
          from PIL import Image, ImageDraw, ImageFont
          from UnityPy.enums import ClassIDType
          from UnityPy.enums.BundleFile import CompressionFlags
          from UnityPy.files import ObjectReader
          from UnityPy.files.SerializedFile import SerializedType
          from UnityPy.helpers import CompressionHelper
          from UnityPy.helpers.Tpk import get_typetree_node

          def tolerante(data, size):
              for m in (1, 2, 4, 8, 16, 32, 64, 128):
                  try:
                      return lz4.block.decompress(data, uncompressed_size=max(size * m, 4096))
                  except Exception:
                      pass
              raise RuntimeError("lz4")

          for n in ("LZ4", "LZ4HC"):
              fl = getattr(CompressionFlags, n, None)
              if fl is not None:
                  CompressionHelper.DECOMPRESSION_MAP[fl] = tolerante

          rep = open("out/report.txt", "w")
          out = pathlib.Path("out"); (out / "prev").mkdir(exist_ok=True)

          S = 1024; cel = S // 4
          capa = Image.new("RGB", (S, S), (0, 0, 0))
          d = ImageDraw.Draw(capa)
          fnt = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", int(cel * 0.33))
          for r in range(-1, 5):
              for c in range(-1, 5):
                  d.text((c * cel + cel // 2, r * cel + cel // 2), "LEVI",
                         font=fnt, fill=(255, 30, 30), anchor="mm")
          capa = capa.rotate(15, resample=Image.BICUBIC, fillcolor=(0, 0, 0))
          capa.save(out / "prev" / "patron.png")
          raw = capa.convert("RGBA").tobytes()
          print("raw bytes:", len(raw), file=rep)

          def blank(node):
              if node.m_Children:
                  return {c.m_Name: blank(c) for c in node.m_Children}
              if node.m_Type in ("float", "double"):
                  return 0.0
              if node.m_Type == "string":
                  return ""
              return 0

          for f in sorted(pathlib.Path("out/blobs").glob("*.bin")):
              dd = f.read_bytes()
              i = dd.find(b"2018.4.12f1\x00")
              size = int.from_bytes(dd[i + 12:i + 20], "big")
              fijo = out / "fijo.bin"
              fijo.write_bytes(dd[:size] if 0 < size < len(dd) else dd)

              env = UnityPy.load(str(fijo))
              for sf in env.files.values():
                  if not hasattr(sf, "types"):
                      continue
                  node = get_typetree_node(ClassIDType.Texture2D, sf.version)
                  print("nodos typetree:", len(list(node.traverse())), file=rep)
                  st = SerializedType.__new__(SerializedType)
                  st.__attrs_init__(ClassIDType.Texture2D.value)
                  st.node = node
                  st.stripped_type = False if hasattr(st, "stripped_type") else None
                  st.script_type_index = -1
                  st.is_stripped_type = False
                  st.old_type_hash = b"\x00" * 16
                  sf.types.append(st)
                  tid = len(sf.types) - 1
                  pid = max(sf.objects) + 1

                  tree = blank(node)
                  print("claves tree:", sorted(tree.keys()), file=rep)
                  tree.update({
                      "m_Name": "levi_holo",
                      "m_ForcedFallbackFormat": 4,
                      "m_DownscaleFallback": 0,
                      "m_Width": S, "m_Height": S,
                      "m_CompleteImageSize": len(raw),
                      "m_MipCount": 1,
                      "m_TextureFormat": 4,
                      "m_IsReadable": 1,
                      "m_ImageSize": len(raw),
                      "m_ImageData": raw,
                  })
                  if "m_StreamData" in tree:
                      tree["m_StreamData"] = {"offset": 0, "size": 0, "path": ""}

                  obj = ObjectReader(sf, sf.reader, pid, tid, st,
                                     ClassIDType.Texture2D.value, ClassIDType.Texture2D,
                                     0, 0, None, None)
                  obj.save_typetree(tree)
                  print("data serializada:", len(obj.data or b""), file=rep)
                  sf.objects[pid] = obj

                  for o in list(sf.objects.values()):
                      if o.type.name != "Material":
                          continue
                      m = o.parse_as_dict()
                      for k in ("_Tex", "_DisTex", "_Mask", "_EmissTex"):
                          for par in m["m_SavedProperties"]["m_TexEnvs"]:
                              if par[0] == k:
                                  par[1]["m_Texture"] = {"m_FileID": 0, "m_PathID": pid}
                      for par in m["m_SavedProperties"]["m_Colors"]:
                          if par[0] == "_Color_Tex":
                              par[1].update({"r": 1.0, "g": 1.0, "b": 1.0, "a": 1.0})
                          if par[0] == "_EdgeColor":
                              par[1].update({"r": 1.0, "g": 1.0, "b": 1.0, "a": 0.1})
                      for par in m["m_SavedProperties"]["m_Floats"]:
                          if par[0] == "_RimPower":
                              par[1] = 1.0
                          if par[0] == "_RimIntensity":
                              par[1] = 3.0
                      o.patch(m)
                  print("materiales enganchados", file=rep)

              try:
                  salida = env.file.save(packer="original")
              except Exception as e:
                  print("packer original fallo:", e, file=rep)
                  salida = env.file.save(packer="lz4")
              (out / "holo_nuevo.bin").write_bytes(salida)
              print("bundle nuevo:", len(salida), "B", file=rep)
          rep.close()
          print(open("out/report.txt").read())
          PY
      - name: Verificar
        run: |
          python - <<'PY'
          import pathlib, UnityPy
          env = UnityPy.load(str(pathlib.Path("out/holo_nuevo.bin")))
          for o in env.objects:
              if o.type.name == "Texture2D":
                  t = o.parse_as_dict()
                  print("TEX", t.get("m_Name"), t.get("m_Width"), t.get("m_Height"),
                        "bytes:", len(t.get("m_ImageData") or b""))
              if o.type.name == "Material":
                  m = o.parse_as_dict()
                  tex = [x for x in m["m_SavedProperties"]["m_TexEnvs"] if x[0] == "_Tex"]
                  print("MAT", m.get("m_Name"), tex[0][1]["m_Texture"] if tex else "sin _Tex")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: holo-inyectado
          path: out
