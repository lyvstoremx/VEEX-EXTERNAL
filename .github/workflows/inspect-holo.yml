name: holo-textura
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/inject_holo.py"
      - ".github/workflows/inspect-holo.yml"

jobs:
  holo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet cryptography UnityPy pillow

      - name: Descifrar
        env:
          P3105: "Levi-externas-veex-6393*#%"
        run: |
          python tools/decrypt3105.py "patches/holo_personaje.3105" work
          ls -l work/blobs

      - name: Recortar
        run: |
          python - <<'EOF'
          import glob, os, struct
          src = max(glob.glob("work/blobs/*.bin"), key=os.path.getsize)
          b = bytearray(open(src, "rb").read())
          n = b.find(b"UnityFS")
          if n < 0:
              raise SystemExit("sin cabecera UnityFS")
          b = b[n:]
          size = struct.unpack(">q", b[0x30:0x38])[0]
          end = 0x30 + 8 + 4 + 4 + size
          if len(b) > end:
              b = b[:end]
          open("work/holo.bundle", "wb").write(bytes(b))
          print("recortado a", len(b))
          EOF

      - name: Inyectar
        run: python tools/inject_holo.py

      - name: Verificar
        run: |
          python - <<'EOF'
          import UnityPy
          p = "work/holo_new.bundle"
          env = UnityPy.load(p)
          tex = [o for o in env.objects if o.type.name == "Texture2D"]
          print("Texture2D:", len(tex))
          for o in tex:
              t = o.read_typetree()
              print(" ", t["m_Name"], t["m_Width"], t["m_Height"], t["m_TextureFormat"], len(t["image data"]))
          for o in env.objects:
              if o.type.name == "Material":
                  for e in o.read_typetree()["m_SavedProperties"]["m_TexEnvs"]:
                      print(" slot", e["first"], "->", e["second"]["m_Texture"]["m_PathID"])
          print("bytes", len(open(p, "rb").read()))
          EOF

      - name: Subir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holo-texturizado
          path: |
            work/holo_new.bundle
            report.txt
